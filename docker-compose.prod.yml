services:

  mysql:
    image: mysql:8.0
    container_name: benefit_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fitaccess_db
      MYSQL_ROOT_PASSWORD: FitAccess@2026
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  migrate:
    image: kalkidan16/benefit-back:latest
    container_name: benefit_migrate
    working_dir: /var/www/html
    command: >
      sh -c "until php artisan migrate --force; do echo 'Retrying in 3s...'; sleep 3; done &&
             php artisan db:seed --force &&
             php artisan storage:link --force &&
             php artisan config:cache &&
             php artisan route:cache &&
             php artisan view:cache"
    environment: &backend_env
      APP_ENV: production
      APP_KEY: base64:y/VTa4B9l+CgpYslb49Yyhy5tV0WggqVbseHm9md0k0=
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: fitaccess_db
      DB_USERNAME: root
      DB_PASSWORD: FitAccess@2026
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      CACHE_STORE: database
      FILESYSTEM_DISK: public
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  app:
    image: kalkidan16/benefit-back:latest
    container_name: benefit_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - storage_data:/var/www/html/storage/app/public
    environment: *backend_env
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:alpine
    container_name: benefit_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx/api.conf:/etc/nginx/conf.d/default.conf
      - storage_data:/var/www/html/public/storage
    depends_on:
      - app

  queue:
    image: kalkidan16/benefit-back:latest
    container_name: benefit_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    environment: *backend_env
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    image: kalkidan16/benefit-front:latest
    container_name: benefit_front
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - nginx

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: benefit_phpmyadmin
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: FitAccess@2026
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  storage_data:
